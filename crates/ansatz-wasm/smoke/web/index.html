  const pass = env.ok && g.x === 6 && g.y === 8 && env2.ok && g2.x === 6 && g2.y === 8;
  lines.push(pass ? 'SMOKE PASS ✓' : 'SMOKE FAIL ✗');
  out.textContent = lines.join('\n');
  out.className = pass ? 'ok' : '';
} catch (e) {
  out.textContent = 'SMOKE FAIL ✗\n' + (e && e.stack || e);
}
</script>
