[package]
name = "ansatz-core"
description = "Ansatz 几何约束求解核心：纯算法、no_std 友好、无任何宿主/平台依赖"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# serde 序列化支持（serde 以 default-features = false + alloc 引入，由外壳按需启用）。
serde = ["dep:serde"]
# JSON Schema 导出（schemars 依赖 std；仅在宿主环境由 ansatz-cli 启用，
# 用于生成 schema/ 目录下的对外契约文件）。
schema = ["dep:schemars", "serde"]

[dependencies]
# libm：纯 Rust 数学库（musl libm 的移植）。它不是宿主相关依赖——无 I/O、
# 无平台分叉，且在所有目标上编译同一份代码，sqrt 等函数的正确舍入结果是
# 构造性的跨平台位级一致（这是 no_std 下使用超越函数的标准答案）。
libm = { workspace = true }
serde = { workspace = true, optional = true, features = ["alloc", "derive"] }
schemars = { workspace = true, optional = true }

[dev-dependencies]
# 自引用 dev 依赖：让 `cargo test -p ansatz-core` 单独运行时也带上 serde feature。
ansatz-core = { path = ".", features = ["serde"] }
serde_json = "1"
