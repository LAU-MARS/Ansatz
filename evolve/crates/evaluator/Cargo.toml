[package]
name = "ansatz-eval"
description = "确定性评测器：候选求解器 × 黄金语料 → 指标 JSON（自进化闭环的 fitness 来源）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only the fixed repository's JSON data contracts are shared. Candidate solvers
# still run as subprocesses; the oracle uses its own geometry implementation.
ansatz-core = { path = "../../../crates/ansatz-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
